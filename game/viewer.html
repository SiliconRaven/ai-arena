<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>擂台回放 · ai-knockback-arena</title>
<!-- 角色立绘大部分来自 B 站用户 ZipZipPipe。sol、terra、sonnet则为作者自己用gpt生成。游戏里的角色小人和动作动画由作者参考相应角色的立绘自行生成。 -->
<link rel="icon" href="data:,">
<style>
/* The replay player in a party-game look: a full-window canvas (the square stage in the sky) with chunky, rounded
   cream panels over it — thick dark outlines and a solid drop under each, candy accents. The clocks on top, the
   scoreboard on the left, the falls on the right, the controls below. The live page (live.css) reuses the panels.
   No web fonts: a rounded system stack, so the standalone viewer works offline. */
:root {
  --ink: #2b2340;
  --dim: #7a6f93;
  --paper: #fffaf0;
  --card: #ffffff;
  --line: #2b2340;
  --accent: #ff6fae;
  --sky: #7fd0ff;
  --sun: #ffd23f;
  --warn: #ffd23f;
  --danger: #ff4d5e;
  --charge: #ff9a1f;
  --gold: #ffc21a;
  --drop: 0 4px 0 var(--line);
  --font: "Arial Rounded MT Bold", "Nunito", "Varela Round", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
}
/* the space station look (render.js THEMES.station): cool white panels, teal with pink */
body.theme-station { --paper: #f4f7ff; --accent: #14b8b0; --sky: #b49cff; --sun: #ffd23f;
                     background: linear-gradient(160deg, #9fb2ff, #ffd3ec); }
body.theme-station button.primary:hover { background: #2fd0c8; }
body.theme-station .clock.main strong { color: #ff6fae; }
body.theme-station .panel h2 { color: var(--accent); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: linear-gradient(180deg, #7fd0ff, #dff5ff); color: var(--ink); font: 600 14px/1.4 var(--font); }
[hidden] { display: none !important; }
code { background: rgba(43, 35, 64, 0.08); padding: 0 4px; border-radius: 4px; }
.dim { color: var(--dim); }
.error { color: var(--danger); }
button, select { font: inherit; font-weight: 800; color: var(--ink); background: var(--card); border: 2.5px solid var(--line);
                 border-radius: 14px; padding: 3px 12px; min-height: 34px; cursor: pointer; box-shadow: 0 3px 0 var(--line);
                 transition: transform 0.06s, box-shadow 0.06s; }
button:hover, select:hover { background: #fff3c4; }
button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
button.primary { background: var(--accent); color: #fff; min-width: 52px; font-size: 16px; text-shadow: 0 1px 0 rgba(43, 35, 64, 0.4); }
button.primary:hover { background: #ff86bb; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

#stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: grab; touch-action: none; }
#stage.dragging { cursor: grabbing; }

.panel { position: fixed; background: var(--paper); border: 3px solid var(--line); border-radius: 20px; box-shadow: var(--drop); }
.panel h2 { margin: 0 0 8px; font-size: 13px; font-weight: 900; letter-spacing: 2px; color: var(--accent); }

#picker { top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(520px, 92vw); padding: 20px 24px; }
#picker h1 { margin: 0 0 8px; font-size: 22px; }

/* the clocks */
#top { top: 12px; left: 50%; transform: translateX(-50%); display: flex; padding: 6px 4px; }
.clock { display: flex; flex-direction: column; padding: 0 18px; min-width: 110px; }
.clock + .clock { border-left: 2px dashed rgba(43, 35, 64, 0.25); }
.label { font-size: 12px; color: var(--dim); }
.clock strong { font-size: 26px; line-height: 1.1; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock.main strong { font-size: 32px; color: var(--accent); -webkit-text-stroke: 1px var(--line); }
.sub { font-size: 12px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sub.warn { color: var(--danger); font-weight: 800; }
.marks { display: flex; gap: 4px; margin-top: 4px; }
.mark { width: 12px; height: 12px; border-radius: 50%; background: currentColor; border: 2px solid var(--line); }
.mark.out { background: transparent; border: 2px dashed currentColor; opacity: 0.6; }

/* the clean view (#ui=0): the arena only, nothing that tells scores, places or who won */
body.clean #top, body.clean #side, body.clean #feed, body.clean #banner { display: none !important; }
/* video mode (#tags=0): under each name only how the player went out, no harness, version or "基准／未知" */
body.no-tags .l-sub > :not(.l-out) { display: none; }

/* the winner */
#banner { top: 114px; left: 50%; transform: translateX(-50%) rotate(-2deg); padding: 8px 20px; display: flex; align-items: center;
          gap: 10px; background: var(--sun); font-size: 17px; font-weight: 900; white-space: nowrap; animation: pop 0.5s cubic-bezier(.2,1.6,.4,1); }
#banner .crown { font-size: 22px; }
#banner img, #banner .neutral { width: 34px; height: 34px; border-radius: 50%; border: 2.5px solid var(--line); background: #fff; }
#banner strong { color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 0 8px;
                 box-shadow: inset 0 -4px 0 var(--seat); }
@keyframes pop { from { transform: translateX(-50%) rotate(-2deg) scale(0.3); } to { transform: translateX(-50%) rotate(-2deg) scale(1); } }

/* the scoreboard */
#side { top: 12px; left: 12px; width: 300px; max-height: calc(100vh - 92px); padding: 12px 10px 10px; overflow-y: auto;
        scrollbar-width: thin; }
#board { display: flex; flex-direction: column; gap: 7px; }
.line { position: relative; display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 12px; border-radius: 14px;
        background: var(--card); border: 2.5px solid var(--line); box-shadow: 0 3px 0 var(--line); overflow: hidden; }
.line::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--seat);
                border-right: 2px solid var(--line); }
.line.out { opacity: 0.55; box-shadow: none; }
.line.out .l-face { filter: grayscale(1); }
.line.winner { background: #fff3c4; opacity: 1; }
.l-place { width: 24px; height: 24px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%;
           font-weight: 900; font-size: 14px; font-variant-numeric: tabular-nums; background: #efeaf8; border: 2px solid var(--line); }
.line.winner .l-place { background: var(--gold); }
.l-face, .f-face, .portrait { flex: none; border-radius: 50%; object-fit: cover; background: #fff; }
.l-face { width: 36px; height: 36px; border: 3px solid var(--seat); box-shadow: 0 0 0 2px var(--line); }
.neutral, #banner .neutral { display: inline-block;
  background: radial-gradient(circle at 33% 27%, white, var(--seat, #8892b0) 42%, #483b48); }
.l-main { flex: 1; min-width: 0; }
.l-name { display: flex; align-items: center; gap: 5px; min-width: 0; }
.l-name strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 900; }
.l-skill { flex: none; padding: 0 5px; border-radius: 8px; border: 2px solid var(--line); font-size: 10px; line-height: 14px;
           font-weight: 900; color: #fff; background: var(--charge); }
.l-skill.hammer { background: #a463ff; }
.l-skill.jab { background: #2fb8d0; }
.l-skill.recover { background: #b9b3c9; color: var(--ink); }
.l-sub { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.harness { padding: 0 6px; border-radius: 999px; background: #dff2ff; color: #1f6fa8; }
.harness.stand-in { background: #fff3c4; color: #9a6b00; }
.l-out { color: var(--danger); font-weight: 800; }
.l-bar { display: flex; height: 8px; margin-top: 3px; border-radius: 5px; background: #fff; border: 2px solid var(--line); overflow: hidden; }
.l-bar i { background: var(--seat); }
.l-bar b { background: var(--charge); }
.l-bar b.hammer { background: #a463ff; }
.l-bar.paused i { background: #b9b3c9; }
.l-kills, .l-score { display: flex; flex-direction: column; align-items: center; min-width: 36px; font-size: 20px; line-height: 1;
                     font-weight: 900; font-variant-numeric: tabular-nums; }
.l-score { color: var(--accent); }
.l-kills small, .l-score small { font-size: 10px; font-weight: 700; color: var(--dim); margin-top: 2px; }

/* the falls */
#feed { top: 12px; right: 12px; width: 304px; max-height: calc(100vh - 92px); padding: 12px 12px 8px; overflow-y: auto; }
#feed-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
#feed-list li { display: flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 12px; font-size: 13px;
                background: var(--card); border: 2px solid var(--line); white-space: nowrap; overflow: hidden; }
#feed-list li.empty { color: var(--dim); border-style: dashed; }
#feed-list li.fresh { animation: fresh 0.6s cubic-bezier(.2,1.6,.4,1); }
#feed-list .t { min-width: 18px; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
#feed-list .f-face { width: 22px; height: 22px; font-size: 11px; border: 2px solid var(--line); }
#feed-list .who { overflow: hidden; text-overflow: ellipsis; max-width: 92px; font-weight: 900; font-size: 12px;
                  -webkit-text-stroke: 0.3px var(--line); }
#feed-list .verb { color: var(--dim); font-size: 12px; }
#feed-list li.kill .verb.hammer { background: #a463ff; }
#feed-list li.kill .verb.bomb { background: #ff9a1f; }
#feed-list li.kill .verb.jab { background: #2fb8d0; }
#feed-list li.kill .verb { color: #fff; background: var(--danger); border: 2px solid var(--line); border-radius: 8px; padding: 0 5px;
                           font-weight: 900; transform: rotate(-4deg); }
@keyframes fresh { from { transform: scale(0.6); background: #fff3c4; } to { transform: scale(1); background: var(--card); } }

/* the controls */
#controls { left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
            padding: 8px 14px; width: min(860px, calc(100vw - 24px)); }
#scrub { flex: 1; min-width: 80px; accent-color: var(--accent); height: 20px; }
#meta { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }

/* narrow (the page in a frame, as on practice.html): the scoreboard gets small, the feed goes */
@media (max-width: 1000px) {
  #side { width: 224px; top: 96px; padding: 8px 6px; }
  .line { padding: 4px 6px 4px 11px; gap: 6px; }
  .l-face { width: 28px; height: 28px; }
  .l-sub { display: none; }
  #feed { display: none; }
  #top .clock { min-width: 84px; padding: 0 12px; }
  #meta { display: none; }
  #banner { top: auto; bottom: 72px; }
}
@media (max-width: 640px) {
  #side { display: none; }
  #top .clock:last-child { display: none; }
  /* a phone: the buttons on one row, the scrubber on its own row below; first/last go (the scrubber does both) */
  #controls { flex-wrap: wrap; justify-content: center; gap: 6px; padding: 8px 10px; }
  #first, #last { display: none; }
  #scrub { order: 1; flex-basis: 100%; min-width: 0; }
  #banner { bottom: 112px; font-size: 15px; }
}
</style>

  <input id="file" type="file" accept=".json,.gz,.html,application/json,text/html">

  <button id="theme" title="换画风">🚀</button>
  <span id="meta" class="dim"></span>
</footer>

const REPLAY=/*REPLAY*/null;
const COLORS = [];

<script>/* art.js */
/* Which pictures a seat gets (assets/CREDITS.md): an entrant's model family picks its avatar token and its map figure
   (the little character on the arena); an entrant no family is recognised in (a baseline, an unknown model) gets a disc
   in the seat's colour with the name's first letter. The seat colour still tells the seats apart. Plain script: it
   puts `DungeonArt` on the window (in node: module.exports). */
(function (root) {
  "use strict";
  const FAMILIES = ["claude", "sonnet", "chatgpt", "sol", "astra", "terra", "gemini", "deepseek", "glm", "grok", "kimi", "qwen", "minimax"];
  const FIGURES = [...FAMILIES, "doubao"];
  const LABELS = {claude: "Claude", chatgpt: "ChatGPT", gemini: "Gemini", deepseek: "DeepSeek", glm: "GLM",
                  grok: "Grok", kimi: "Kimi", qwen: "Qwen", minimax: "MiniMax", sol: "GPT Sol", astra: "GPT Astra", terra: "GPT Terra",
                  sonnet: "Claude Sonnet", doubao: "豆包"};
  const PORTRAITS = {"mfuns-deepseek": ["deepseek", "DeepSeek 立绘"], "mfuns-chatgpt": ["chatgpt", "ChatGPT 立绘"],
                     "mfuns-claude": ["claude", "Claude 立绘"], "mfuns-kimi": ["kimi", "Kimi 立绘"],
                     "mfuns-qwen": ["qwen", "千问 立绘"], "mfuns-gemini": ["gemini", "Gemini 立绘"],
                     "mfuns-glm": ["glm", "GLM 立绘"],
                     "mfuns-grok": ["grok", "Grok 立绘"], "mfuns-minimax": ["minimax", "MiniMax 立绘"],
                     "mfuns-doubao": [null, "豆包"]};
  const AVATARS = [...FAMILIES, ...Object.keys(PORTRAITS)];
  /** Keywords in a seat's name or entrant id, first match wins. */
  const KEYWORDS = [["claude", "claude"], ["anthropic", "claude"], ["chatgpt", "chatgpt"], ["openai", "chatgpt"],
                    ["codex", "chatgpt"], ["gpt", "chatgpt"], ["gemini", "gemini"], ["deepseek", "deepseek"],
                    ["zhipu", "glm"], ["glm", "glm"], ["grok", "grok"], ["kimi", "kimi"], ["moonshot", "kimi"],
                    ["qwen", "qwen"], ["minimax", "minimax"]];
  /** Seat colours (seat 0 first), picked to read on the arena floor and the abyss and to differ from each other. */
  const SEAT_COLORS = ["#ff8a3d", "#2fe0f5", "#9dff7a", "#ff4fc0", "#f8c844", "#a98bff", "#ff5d6c", "#4f8bff",
                       "#e8e2ff", "#3dd6a0"];

  /** The model family named in any of `texts` (a seat's name, entrant id …), or null. */
  function familyOf(...texts) {
    for (const text of texts) {
      if (!text) continue;
      const lower = String(text).toLowerCase().replace(/\s+/g, "-");
      if (lower.includes("doubao")) return "doubao";
      if (/(?:^|[^a-z0-9])sonnet(?:$|[^a-z0-9])/.test(lower)) return "sonnet";
      for (const variant of ["sol", "astra", "terra"]) {
        if (lower === variant || new RegExp(`(?:gpt|codex|openai|chatgpt)[\\w.-]*[-_.]${variant}(?:$|[-_.])`).test(lower)) return variant;
      }
      for (const [key, family] of KEYWORDS) if (lower.includes(key)) return family;
    }
    return null;
  }

  function seatColor(i) { return SEAT_COLORS[i % SEAT_COLORS.length]; }
  function color(value) { return typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value) ? value.toLowerCase() : null; }
  function label(family) { return PORTRAITS[family]?.[1] || LABELS[family] || "中性（基准／未知）"; }

  /** Portrait choices reuse their family's figure set. */
  function spriteFamily(avatar) { return FIGURES.includes(avatar) ? avatar : avatar === "mfuns-doubao" ? "doubao" : PORTRAITS[avatar]?.[0] || null; }

  // The HTML carries the participating characters; imported replays can also use the project's PNGs.
  // Keep each exported match portable. Use short blob URLs when the board redraws portraits.
  const imageUrls = new Map();
  function assetUrl(path) {
    if (imageUrls.has(path)) return imageUrls.get(path);
    const encoded = MATCH_ART?.images[path];
    if (!encoded) return (MATCH_ART ? "../../assets/" : "../assets/") + path;
    const bytes = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], {type: "image/png"}));
    imageUrls.set(path, url);
    return url;
  }
  function tokenPath(family) {
    const name = Object.hasOwn(PORTRAITS, family) ? family.slice(6) : FIGURES.includes(family) ? family : null;
    return name ? assetUrl(`avatars/${name}.png`) : null;
  }
  const FIGURE_POSES = [null, "walk_a", "walk_b", "attack", "repair", "hit", "destroyed"];
  /** Includes null for the standing picture. Return a copy so callers cannot change the contract. */
  function figurePoses() { return FIGURE_POSES.slice(); }
  /** Standing characters are 128 px; action canvases are 192 px with idle anchored at (32,64). */
  function figurePath(family, pose) {
    const set = spriteFamily(family);
    if (!set) return null;
    if (set === "sonnet" && pose === "hit") return "figures/sonnet/hurt_map_192.png";
    if (set === "sonnet" && ["repair", "destroyed"].includes(pose)) return "figures/sonnet.png";
    return set !== "terra" && pose && FIGURE_POSES.includes(pose) ? `figures/${set}/${pose}_map_192.png` : `figures/${set}.png`;
  }
  /** Action poses drawn for the knockback game (`<pose>_map_192.png`, facing right, the same 192 px canvas and foot
      line as the other poses). A family may not have them yet: the caller falls back when the picture fails to load. */
  const ACTION_POSES = ["dash_charge", "roll", "hammer_charge", "hammer_swing", "jab", "throw", "hurt", "tumble"];
  function actionPath(family, pose) {
    if (!ACTION_POSES.includes(pose)) return null;
    const set = spriteFamily(family);
    return set ? `figures/${set}/${pose}_map_192.png` : null;
  }
  /** Every picture a seat of this family can be drawn with: the standing figure, the old poses and the action poses
      (for preloading when a replay opens). */
  function allFigurePaths(family) {
    const paths = new Set([...FIGURE_POSES.map(pose => figurePath(family, pose)), ...ACTION_POSES.map(pose => actionPath(family, pose))]);
    paths.delete(null);
    return [...paths];
  }
  function isPose(path) { return typeof path === "string" && /_map_(96|192)\.png$/.test(path); }

  /** Loads pictures once; `get` returns the image when loaded (else null and `onload` fires later), `grey` a greyed
      copy (canvas filter; drawing a file:// image this way does not need to read its pixels). */
  function Sprites(onload) {
    const images = new Map(), greys = new Map();
    function get(path) {
      if (!path) return null;
      let entry = images.get(path);
      if (!entry) {
        const image = new Image();
        entry = {image, ready: false};
        image.onload = () => { entry.ready = true; onload(); };
        image.onerror = () => { entry.failed = true; };
        image.src = assetUrl(path);
        images.set(path, entry);
      }
      return entry.ready ? entry.image : null;
    }
    function grey(path) {
      const image = get(path);
      if (!image) return null;
      let canvas = greys.get(path);
      if (!canvas) {
        canvas = document.createElement("canvas");
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        const ctx = canvas.getContext("2d");
        ctx.filter = "grayscale(1) brightness(1.3)";
        ctx.drawImage(image, 0, 0);
        greys.set(path, canvas);
      }
      return canvas;
    }
    /** Starts loading `paths` and resolves when each has loaded or failed. */
    function preload(paths) {
      return Promise.all(paths.filter(Boolean).map(path => {
        get(path);
        const entry = images.get(path), {image} = entry;
        // Cached images may be complete before their load callback runs. Wait for our actual ready/failed state.
        if (entry.ready || entry.failed) return null;
        return new Promise(done => {
          image.addEventListener("load", done, {once: true});
          image.addEventListener("error", done, {once: true});
        });
      }));
    }
    return {get, grey, preload};
  }

  const api = {FAMILIES, FIGURES, AVATARS, spriteFamily, familyOf, seatColor, color, label, tokenPath, figurePath, figurePoses, actionPath, ACTION_POSES, allFigurePaths, isPose, Sprites};
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.DungeonArt = api;
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>
<script>/* scene.js */
/* A knockback replay (docs/DESIGN.md "K0 的接口约定") as every picture of it needs it: the seats with their names,
   families and colours, every player's position at any moment (the frames' per-tick `ticks`, interpolated), the

  return {create, fit, thumb, themeFrom, THEMES, PAL};

<script>/* live_state.js */
/* What the live pages say about a match, without any DOM, so node tests load it as is (module.exports) and the
   pages get `DungeonLive`.

   - decided(frame, maxTurns): whether a frame already settles the match (the end line comes later).
   - matches(detail, limit): an event's matches being played (its live files) and the latest finished attempts (its
     ledger), for the match picker. */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.DungeonLive = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  /** A match whose frame already settles it (game/engine.py `done`): at most one player on the arena, or the last turn. The
      runner writes the end line and saves the replay only after stopping every bot, which takes a while with many
      sandboxed programs: from this frame on a viewer shows the match as over, its replay being saved. */
  function decided(frame, maxTurns) {
    if (!frame || !Array.isArray(frame.out)) return false;
    return frame.out.filter(o => o === null).length <= 1 || (Number.isInteger(maxTurns) && frame.turn >= maxTurns);
  }

  /** The picker's lists: matches being played (live files), and the finished ones newest first — a match over but
      its replay not saved yet (its live file ended or settled) first, as "saving" with its live path. */
  function matches(detail, limit = 12) {
    const live = (detail && detail.live || []).map(m => ({...m, id: matchId(m.path)}));
    const playing = new Set(live.map(m => m.id));
    const saving = live.filter(m => m.ended || m.decided)
      .map(m => ({id: m.id, status: "saving", seats: m.names || [], live: m.path, replay: null}));
    const finished = (detail && detail.matches || [])
      .filter(m => (m.status === "ok" || m.status === "failed") && !playing.has(m.id))
      .sort((a, b) => String(b.finished || "").localeCompare(String(a.finished || "")));
    return {live, finished: saving.concat(finished).slice(0, limit)};
  }
  /** "EVENT/live/4p-000-01-2-a1.jsonl" -> "4p-000-01-2" (the ledger's match id). */
  function matchId(path) {
    const file = String(path).split("/").pop().replace(/\.jsonl$/, "");
    return file.replace(/-a\d+$/, "");
  }

  return {decided, matches, matchId};
});

<script>/* sfx.js */
/* Quiet sound effects for replays (user, 2026-11-05, for the recap video: "能不能在解说比赛那几段加上游戏音效，比如炸弹
   爆炸，重锤等等，声音不要太大"). Every sound is synthesised here with WebAudio (no audio files): short and toy-like, to
   go with the cute figures.

     bomb    a bomb goes off (bomb_explode)          a soft crack, a low "boom" and a puff of noise
     hammer  a heavy hammer lands (hammer)           a thump falling in pitch and a wooden clonk; a fuller charge
                                                     is lower, longer and louder; a "bonk" when it hits someone
     jab     the light hammer swings (attack)        a short high "tok"; a little knock when it hits
     dash    a dash is released (dash)               a quick rising "fwip" of air, stronger with the charge
     spring  a spring wall bounces a body (spring)   a wobbly rising "boing", by how hard it bounced (soft
                                                     bounces, under MIN_SPRING, are silent)
     fall    a player falls off (fall)               a falling slide whistle
     shrink  the stage starts to shrink (shrink)     two soft low notes going down

   `set`, and calls `span(R, T0, T1)` only for the ticks it plays forward on screen (not while seeking, jumping,
   paused, asleep or hidden), so each event sounds once, as it is drawn, at any playback speed (a 0.1x replay

   kind at most every GAP seconds, at most MAX_VOICES at a time (the more important kept), and a compressor on the

    take((R.springs || []).filter(e => bounce(e) >= MIN_SPRING), "spring", bounce, none);
    take(R.falls, "fall", full, none);
    take((R.shrinks || []).filter(e => e.type === "shrink"), "shrink", full, none);
    return [...by.values()].sort((a, b) => a.tick - b.tick || RANK[b.kind] - RANK[a.kind]);
  }
  const clamp01 = x => (Number.isFinite(x) ? Math.max(0, Math.min(1, x)) : 1);

  // ---- the sounds ---------------------------------------------------------------------------------------------
  const noises = new WeakMap();
  /** One second of white noise for this context (a fixed sequence, so renders are the same every time). */
  function noiseBuffer(ctx) {
    if (!noises.has(ctx)) {
      const n = ctx.sampleRate, buffer = ctx.createBuffer(1, n, ctx.sampleRate), data = buffer.getChannelData(0);
      let s = 12345;
      for (let i = 0; i < n; i++) { s = (Math.imul(s, 1103515245) + 12345) >>> 0; data[i] = s / 2147483648 - 1; }
      noises.set(ctx, buffer);
    }
    return noises.get(ctx);
  }
  /** A gain from 0 up to `peak` in `attack` s, then down to silence in `decay` s (exponentially). */
  function env(ctx, out, t, attack, peak, decay) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    g.gain.setValueAtTime(0, t + attack + decay + 0.005);
    g.connect(out);
    return g;
  }
  /** An oscillator gliding from f0 to f1 Hz over `glide` s. */
  function osc(ctx, out, type, t, end, f0, f1, glide) {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + glide);
    o.connect(out);
    o.start(t); o.stop(end + 0.02);
    return o;
  }
  function noise(ctx, out, t, end) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx); src.loop = true;
    src.connect(out);
    src.start(t, (t * 7.31) % 0.9); src.stop(end + 0.02);
    return src;
  }
  function filter(ctx, out, type, f, q = 0.7) {
    const b = ctx.createBiquadFilter();
    b.type = type; b.frequency.value = f; b.Q.value = q;
    b.connect(out);
    return b;
  }
  /** A wobble of `depth` Hz at `rate` Hz on an oscillator's pitch. */
  function vibrato(ctx, o, t, end, rate, depth) {
    const lfo = ctx.createOscillator(), g = ctx.createGain();
    lfo.frequency.value = rate; g.gain.value = depth;
    lfo.connect(g); g.connect(o.frequency);
    lfo.start(t); lfo.stop(end + 0.02);
  }

  /** Each schedules its sound at context time t into `out` and returns when it has died away. */
  const VOICES = {
    bomb(ctx, out, t) {
      const end = t + 0.55;
      osc(ctx, env(ctx, out, t, 0.005, 0.9, 0.45), "sine", t, end, 120, 40, 0.35);
      const puff = filter(ctx, env(ctx, out, t, 0.004, 0.55, 0.38), "lowpass", 2400);
      puff.frequency.setValueAtTime(2400, t);
      puff.frequency.exponentialRampToValueAtTime(260, t + 0.35);
      noise(ctx, puff, t, end);
      noise(ctx, filter(ctx, env(ctx, out, t, 0.001, 0.25, 0.05), "highpass", 1800), t, t + 0.08);
      return end;
    },
    hammer(ctx, out, t, cue) {
      const p = cue.power, k = 0.45 + 0.55 * p, end = t + 0.5;
      osc(ctx, env(ctx, out, t, 0.004, 0.85 * k, 0.14 + 0.2 * p), "sine", t, end, 200 - 70 * p, 60 - 15 * p, 0.1 + 0.08 * p);
      osc(ctx, env(ctx, out, t, 0.002, 0.3 * k, 0.06), "triangle", t, t + 0.1, 620 - 160 * p, 380 - 100 * p, 0.05);
      noise(ctx, filter(ctx, env(ctx, out, t, 0.001, 0.22 * k, 0.04), "bandpass", 1500, 1.5), t, t + 0.06);
      if (cue.hit) {
        const at = t + 0.012;
        osc(ctx, filter(ctx, env(ctx, out, at, 0.002, 0.22 * k, 0.09), "lowpass", 2000), "triangle", at, at + 0.12, 330, 240, 0.08);
      }
      return end;
    },
    jab(ctx, out, t, cue) {
      const end = t + 0.12;
      osc(ctx, env(ctx, out, t, 0.002, 0.6, 0.06), "triangle", t, end, 1000, 560, 0.05);
      noise(ctx, filter(ctx, env(ctx, out, t, 0.001, 0.25, 0.025), "highpass", 2500), t, t + 0.04);
      if (cue.hit) osc(ctx, env(ctx, out, t + 0.008, 0.002, 0.5, 0.05), "sine", t + 0.008, end, 420, 300, 0.05);
      return end;
    },
    dash(ctx, out, t, cue) {
      const k = 0.5 + 0.5 * cue.power, end = t + 0.2;
      const band = filter(ctx, env(ctx, out, t, 0.025, 1.5 * k, 0.15), "bandpass", 450, 1.4);
      band.frequency.setValueAtTime(450, t);
      band.frequency.exponentialRampToValueAtTime(2800, t + 0.17);
      noise(ctx, band, t, end);
      return end;
    },
    spring(ctx, out, t, cue) {
      const k = 0.55 + 0.45 * cue.power, end = t + 0.38;
      const o = osc(ctx, env(ctx, out, t, 0.004, 0.54 * k, 0.34), "sine", t, end, 240, 480, 0.3);
      vibrato(ctx, o, t, end, 16, 40);
      return end;
    },
    fall(ctx, out, t) {
      const end = t + 0.78, g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.17, t + 0.03);
      g.gain.setValueAtTime(0.17, t + 0.45);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
      g.gain.setValueAtTime(0, t + 0.76);
      g.connect(out);
      const o = osc(ctx, g, "sine", t, end, 900, 160, 0.7);
      vibrato(ctx, o, t, end, 7, 18);
      return end;
    },
    shrink(ctx, out, t) {
      const soft = filter(ctx, out, "lowpass", 1400);
      osc(ctx, env(ctx, soft, t, 0.01, 0.42, 0.2), "triangle", t, t + 0.22, 330, 330, 0.2);
      osc(ctx, env(ctx, soft, t + 0.2, 0.01, 0.48, 0.32), "triangle", t + 0.2, t + 0.55, 247, 247, 0.3);
      return t + 0.55;
    },
  };

  /** Where the sounds go: a trim, a compressor (loud moments do not stack up) and the master gain. */
  function bus(ctx, destination, gain) {
    const input = ctx.createGain(), squeeze = ctx.createDynamicsCompressor(), master = ctx.createGain();
    input.gain.value = TRIM;
    squeeze.threshold.value = -18; squeeze.knee.value = 6; squeeze.ratio.value = 4;
    squeeze.attack.value = 0.003; squeeze.release.value = 0.2;
    master.gain.value = gain;
    input.connect(squeeze); squeeze.connect(master); master.connect(destination);
    return {input, master};
  }

  /** Renders cues [{kind, at (s), power, hit}] offline (calibration, listening samples): a Promise of a mono
      AudioBuffer. */
  function render(cues, {sampleRate = 48000, tail = 1, volume = 1} = {}) {
    const Offline = root.OfflineAudioContext || root.webkitOfflineAudioContext;
    const length = Math.ceil((Math.max(0, ...cues.map(c => c.at)) + tail) * sampleRate);
    const ctx = new Offline(1, length, sampleRate), b = bus(ctx, ctx.destination, LEVEL * volume);
    for (const cue of cues) VOICES[cue.kind](ctx, b.input, cue.at, {power: 1, hit: false, ...cue});
    return ctx.startRendering();
  }

  /** The page's player: silent until `set(true)`; `span` plays the cues of the ticks just played on screen. */
  function Player(make = () => new (root.AudioContext || root.webkitAudioContext)()) {
    let ctx = null, b = null, on = false, volume = 1;
    let voices = [];                               // [{end, rank}] sounding now
    const last = {}, played = [];
    function set(enable, level) {
      on = Boolean(enable);
      if (Number.isFinite(level)) volume = Math.max(0, Math.min(2, level));
      if (on && !ctx) {
        try { ctx = make(); } catch (_) { ctx = null; return; }
      }
      if (!ctx) return;
      if (!on) {                                     // silent at once: what still sounds is cut off, nothing waits
        if (b) {
          b.master.gain.cancelScheduledValues(ctx.currentTime);
          b.master.gain.setValueAtTime(0, ctx.currentTime);
          b.master.disconnect();
          b = null;
        }
        voices = [];
        if (ctx.state === "running") ctx.suspend().catch(() => {});
        return;
      }
      if (!b) b = bus(ctx, ctx.destination, LEVEL * volume);
      else b.master.gain.setValueAtTime(LEVEL * volume, ctx.currentTime);
      if (ctx.state === "suspended") ctx.resume().catch(() => {});
    }
    function span(R, T0, T1) {
      if (!on || !ctx || !b || !(T1 > T0)) return;
      const cues = due(R, T0, T1);
      if (!cues.length) return;
      if (ctx.state !== "running") {                // not allowed to sound yet: these are dropped, not queued
        if (ctx.state === "suspended") ctx.resume().catch(() => {});
        for (const cue of cues) remember(cue, ctx.state);
        return;
      }
      const now = ctx.currentTime + 0.005;
      voices = voices.filter(v => v.end > now);
      for (const cue of cues) {
        if (now - (last[cue.kind] ?? -Infinity) < GAP[cue.kind]) { remember(cue, "gap"); continue; }
        if (voices.length >= MAX_VOICES) {
          const weakest = voices.reduce((a, v) => (v.rank < a.rank ? v : a));
          if (weakest.rank >= RANK[cue.kind]) { remember(cue, "busy"); continue; }
          voices.splice(voices.indexOf(weakest), 1);   // still sounding out, but no longer counted
        }
        last[cue.kind] = now;
        voices.push({end: VOICES[cue.kind](ctx, b.input, now, cue), rank: RANK[cue.kind]});
        remember(cue, "played");
      }
    }
    /** What happened to each cue, the last 200 (checks from outside: KbReplay.sfx.played). */
    function remember(cue, what) {
      played.push({kind: cue.kind, tick: cue.tick, power: cue.power, hit: cue.hit, what});
      if (played.length > 200) played.shift();
    }
    return {set, span, played, get on() { return on; }, get state() { return ctx ? ctx.state : "none"; }};
  }

  return {due, render, Player, VOICES, KINDS, LEVEL};
});
</script>
<script>/* game.js */
/* The replay player: draws a knockback replay (docs/DESIGN.md "K0 的接口约定") on a canvas — the arena, every
   player's little figure, dashes, bumps and falls (render.js) — with the scoreboard and the falls beside it
   (board.js). It loads a replay from `?replay=URL`, from a file the viewer picks, or from the page itself (the
   standalone viewer, game/viewer.html, carries one in `const REPLAY=`). `?live=PATH` watches a match while it is
   played: the console's /api/live/PATH (a live file, arena/core.py LiveFile) is asked once a second for the lines
   written since, frames are added as they come, and once the match is over (its end line, or its live file gone
   because the replay was kept) the finished replay is loaded in its place.

   Playback is smooth: the moment T counts ticks and moves at the match's tick rate × speed, players are placed from
   each turn's per-tick positions. Hash parameters for a fixed picture: #t=TURN&speed=N&play=1&z=ZOOM&c=X,Y, and
   &until=TURN to stop playing at the end of that turn. #ui=0 is the clean view, for clips that must not tell how a
   match ends: only the arena, the figures with their name tags and the effects; no clocks, scoreboard, feed,
   winner banner, crown or confetti. Video mode, for what viewers see rather than what we check: #names=JSON gives
   the seats the video's own names ({"claude-opus-5-5": "Opus", "warden": "守卫"}: by the model of the program as
   /api/players names it, else by the seat's name in the match, where a copy number is kept: warden-2 → "守卫 2"),
   and #tags=0 hides what is under each name on the scoreboard (harness, program version, "基准／未知"; how a
   player went out stays).

   Once the replay is drawn with every seat's figure loaded (after /api/players named them), the page sets
   KbReplay.ready and, inside a frame, posts {type: "kb-replay-ready", replay, hash} to its parent (and again after each
   hash change), so an embedding page can keep the frame hidden until then and start playing only when the figures
   are there.

   An embedding page in video mode (#names= at load) can also save the slow /api/players answer: the page asks it
   first ({type: "kb-players-ask", replay}; the answer {type: "kb-players", replay, players}, players null when it has
   none, within PLAYERS_ASK_MS) and tells it what the console said ({type: "kb-players", replay, players}).
   ?prefetch=1&replay=URL only asks the console who played and tells the embedding page, nothing else (no drawing).
   {type: "kb-replay-sleep", sleep} from the embedding page stops and resumes painting (a page kept hidden for later).
   Sound effects (sfx.js; user, 2026-11-05: "能不能在解说比赛那几段加上游戏音效，比如炸弹爆炸，重锤等等，声音不要太大"):
   off unless the embedding page sends {type: "kb-sfx", on, volume}; then each event sounds once as playback crosses
   it on screen (not while seeking, jumping, paused, asleep or in a hidden tab).

   Two looks (render.js THEMES): sky (the default) and station. The 🌤️/🚀 button switches; the choice is kept in
   this browser (localStorage, when it works) and `?theme=sky|station` in the address overrides it. */
(function () {
  "use strict";
  const Art = window.DungeonArt, Scene = window.KbScene, Render = window.KbRender, Board = window.KbBoard;
  const Live = window.DungeonLive;
  const $ = id => document.getElementById(id);
  const esc = Board.esc;

  const canvas = $("stage"), ctx = canvas.getContext("2d");
  let dirty = true;
  const sprites = Art.Sprites(() => { dirty = true; });
  let R = null, renderer = null;                           // the loaded replay (scene.js) and its painter
  let watching = null;                                     // ?live=: {path, next, replay (its RUNS path), ended}
  // follow: the camera keeps the stage in view as it shrinks (until the viewer pans or zooms; ⤢ turns it back on)
  // clean: #ui=0 (no panels, no winner); until: #until=TURN as a tick, where playing stops (null: the replay's end)
  const view = {T: 0, turn: -1, falls: -1, playing: false, speed: 1, last: 0, cam: {x: 0, y: 0, s: 1}, fit: 1, follow: true,
                clean: false, until: null};
  const stopAt = () => (view.until === null ? R.tail : Math.min(R.tail, view.until));

  // ---- loading ------------------------------------------------------------------------------------------------
  async function bytesToReplay(buffer) {
    let bytes = new Uint8Array(buffer);
    if (bytes[0] === 0x1f && bytes[1] === 0x8b) {          // .json.gz (a tournament's replays/)
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
      bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    }
    const text = new TextDecoder("utf-8").decode(bytes).trim();
    if (text.startsWith("<")) {
      const embedded = text.match(/\bconst REPLAY=(\{[\s\S]*?\});[ \t]*\r?\n[ \t]*const COLORS\s*=/);
      if (!embedded) throw new Error("这份 HTML 里没有可读取的回放数据");
      return JSON.parse(embedded[1]);                    // parse data only; never execute an imported HTML script
    }
    return JSON.parse(text);
  }

  async function start() {
    const params = new URLSearchParams(location.search);
    if (typeof REPLAY !== "undefined" && REPLAY) return open(REPLAY, "embedded");   // eslint-disable-line no-undef
    if (params.get("live")) return watch(params.get("live"));
    const url = params.get("replay");
    if (!url) return showPicker();
    if (params.get("prefetch") === "1") {                      // only who played, for the embedding page's store
      const players = await playersOf(url);
      if (players) tellHost({type: "kb-players", replay: url, players});
      return;
    }
    try {
      const profiles = embeddedVideo() ? fromHost(url).then(players => players || playersOf(url).then(fresh => {
        if (fresh) tellHost({type: "kb-players", replay: url, players: fresh});
        return fresh;
      })) : playersOf(url);
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const opened = await open(await bytesToReplay(await response.arrayBuffer()), url);
      profiles.then(players => applyPlayers(opened, players)).then(() => announceReady(opened));
    } catch (error) {
      showPicker(`读不到 ${url}：${error.message}`);
    }
  }

  /** In a frame, in video mode: the embedding page may know who played already (see the top). */
  const PLAYERS_ASK_MS = 400;
  const host = () => (window.parent && window.parent !== window && typeof window.parent.postMessage === "function"
    ? window.parent : null);
  const tellHost = message => { const to = host(); if (to) to.postMessage(message, "*"); };   // nothing private
  const embeddedVideo = () => Boolean(host()) && new URLSearchParams(location.hash.slice(1)).has("names");
  function fromHost(url) {
    return new Promise(resolve => {
      const done = players => { window.removeEventListener("message", listen); clearTimeout(timer); resolve(players); };
      const listen = event => {
        const d = event.source === host() && event.data;
        if (d && d.type === "kb-players" && d.replay === url) done(Array.isArray(d.players) ? d.players : null);
      };
      window.addEventListener("message", listen);
      const timer = setTimeout(() => done(null), PLAYERS_ASK_MS);
      tellHost({type: "kb-players-ask", replay: url});
    });
  }
  let asleep = false;
  window.addEventListener("message", event => {
    const d = event.source === host() && event.data;
    if (d && d.type === "kb-replay-sleep") {
      asleep = Boolean(d.sleep); dirty = true;
      if (asleep && sfx) sfx.set(false);                     // a page put away is silent at once (on again: kb-sfx)
    }
    if (d && d.type === "kb-sfx" && sfx) sfx.set(d.on, Number(d.volume));
  });
  // sound effects, silent until the embedding page turns them on (see the top); none where sfx.js is not loaded
  const sfx = window.KbSfx ? window.KbSfx.Player() : null;

  /** Who played each seat as the console names them (/api/players: the model, harness and version of a coding
      round's code; display only). Null when the page is not served by the console or the replay is not under it. */
  async function playersOf(url, header = null) {
    if (location.protocol === "file:") return null;
    try {
      const response = header ? await fetch("/api/players", {method: "POST",
        headers: {"Content-Type": "application/json", "X-Console": "1"},
        body: JSON.stringify({header: Object.fromEntries(["names", "seats", "practice"]
          .filter(key => header[key] !== undefined).map(key => [key, header[key]]))})})
        : await fetch(`/api/players?${new URLSearchParams({replay: url})}`);
      return response.ok ? (await response.json()).players : null;
    } catch (_) { return null; }
  }
  /** Starts loading every picture the seats of this replay can be drawn with (standing figure, poses, action poses),
      so a pose is ready the first time it is needed; resolves when each has loaded or failed. */
  function preloadFigures() {
    R.figures = sprites.preload([...new Set(R.seats.flatMap(seat => Art.allFigurePaths(seat.figure)))]);
    return R.figures;
  }
  /** Resolves once the pictures of the seats as finally named are loaded (or failed). */
  function applyPlayers(opened, players) {
    if (R !== opened || !players) return opened.figures;
    for (const seat of R.seats) seat.name = seat.given ?? seat.name;   // the console sees its own names, not ours
    Board.applyProfiles(R, players);
    names(); panels(true); dirty = true;
    return preloadFigures();                                  // the families the console named may differ
  }
  /** The replay is drawn with its figures: tell a page embedding this one (and checks from outside, KbReplay.ready). */
  function announceReady(opened) {
    if (R !== opened || !renderer) return;
    draw(performance.now());
    opened.ready = true;
    if (window.KbReplay) window.KbReplay.ready = true;
    const host = window.parent;
    if (host && host !== window && typeof host.postMessage === "function")
      host.postMessage({type: "kb-replay-ready", replay: opened.source, hash: location.hash}, "*");   // nothing private
  }

  // ---- a match being played (?live=) ----------------------------------------------------------------------------
  const LIVE_POLL_MS = 1000, REPLAY_TRIES = 90;
  async function watch(path) {
    watching = {path, next: 0, replay: null, ended: false, building: {header: null, frames: [], result: {}}};
    while (watching && !watching.ended) {
      if (!document.hidden) {
        let response;
        try { response = await fetch(`/api/live/${encodeURI(path)}?from=${watching.next}`); }
        catch (_) { response = null; }                        // the console is away: ask again
        if (response && response.status === 404) { watching.ended = true; break; }   // over, its replay kept
        if (response && response.ok) await take(await response.json());
      }
      if (!watching.ended) await new Promise(resolve => setTimeout(resolve, LIVE_POLL_MS));
    }
    if (!R) return showPicker(`没有正在打的对局 ${path}：可能已经打完，回放在控制台里。`);
    panels(true);
    await finished();
  }
  /** Adds a poll's lines to the match being watched; keeps playing up to the newest turn when the view was there. */
  async function take(answer) {
    const replay = watching.building, before = replay.frames.length;   // R.frames is this same array
    for (const line of answer.lines) {
      if (line.header) { replay.header = line.header; watching.replay = line.replay; watching.players = line.players || null; }
      else if (line.frame) replay.frames.push(line.frame);
      else if (line.end) {
        watching.ended = true; watching.error = line.end.error || null;
        replay.result = line.end.error ? {} : line.end;
      }
    }
    watching.next = answer.next;
    if (!replay.header || !replay.frames.length) return;
    if (!R) {
      await open(replay, watching.path, watching.players);
      view.T = Math.max(0, R.end - R.D);
      setPlaying(true);
      return;
    }
    const atEnd = view.T >= (before - 1) * R.D - 1e-6;
    Scene.index(R);
    $("scrub").max = R.frames.length - 1;
    if (atEnd && view.T < R.tail) setPlaying(true);           // play on up to the newest turn
    panels(true);
    dirty = true;
  }
  /** The match is over: show the finished replay (the result, the kept records) from where the viewer is. */
  async function finished() {
    if (!watching.replay || watching.error) return;
    for (let i = 0; i < REPLAY_TRIES; i++) {                  // the replay is moved into place just after the end
      try {
        const response = await fetch(`/replay/${encodeURI(watching.replay)}`);
        if (response.ok) {
          const keep = {T: view.T, cam: view.cam, playing: view.playing};
          await open(await bytesToReplay(await response.arrayBuffer()), watching.replay, watching.players);
          view.cam = keep.cam; view.T = Math.min(keep.T, R.tail); setPlaying(keep.playing); panels(true);
          watching = null;
          return;
        }
      } catch (_) { /* not yet */ }
      await new Promise(resolve => setTimeout(resolve, LIVE_POLL_MS));
    }
  }

  function showPicker(message) {
    $("picker").hidden = false;
    $("load-error").textContent = message || "";
  }
  async function openFile(file) {
    try {
      const replay = await bytesToReplay(await file.arrayBuffer()), opened = await open(replay, file.name);
      playersOf(null, replay.header).then(players => applyPlayers(opened, players)).then(() => announceReady(opened));
    }
    catch (error) { showPicker(`${file.name} 不是可读的回放：${error.message}`); }
  }
  $("file").addEventListener("change", event => { if (event.target.files[0]) openFile(event.target.files[0]); });
  window.addEventListener("dragover", event => event.preventDefault());
  window.addEventListener("drop", event => {
    event.preventDefault();
    if (event.dataTransfer.files[0]) openFile(event.dataTransfer.files[0]);
  });

  // ---- drawing ------------------------------------------------------------------------------------------------
  function resize() {
    view.safe = null;                                       // measured again on the next picture
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
    dirty = true;
  }
  const narrow = () => innerWidth < 1000;
  /** The room between the panels (the clean view has none: the whole window but the controls at the bottom). */
  function stageBox() {
    if (view.clean) return {left: 20, top: 20, width: Math.max(100, innerWidth - 40), height: Math.max(100, innerHeight - 110)};
    const tiny = innerWidth < 640;
    const left = tiny ? 8 : narrow() ? 240 : 324, right = tiny ? 8 : narrow() ? 8 : 304;
    const top = narrow() ? 96 : 100, bottom = tiny ? 104 : 70;
    return {left, top, width: Math.max(100, innerWidth - left - right), height: Math.max(100, innerHeight - top - bottom)};
  }
  const MAX_FOLLOW_ZOOM = 2.2;
  /** The camera that follows the stage: the square as it is at moment T, zoomed in at most MAX_FOLLOW_ZOOM times. */
  function followCam() {
    const half = Math.max(Scene.arenaAt(R, Math.min(view.T, R.end)).half, R.H0 / MAX_FOLLOW_ZOOM);
    return Render.fit(R, stageBox(), half);
  }
  /** Back to following the stage, at once. */
  function fitCamera() {
    view.fit = Render.fit(R, stageBox()).s;
    view.follow = true;
    view.cam = followCam();
    dirty = true;
  }
  /** One step of the camera towards following the stage (eased), while it follows. */
  function ease() {
    if (!view.follow) return;
    const to = followCam(), from = view.cam, k = 0.12;
    const w = innerWidth / 2, h = innerHeight / 2;
    const cx = from.x + w / from.s + (to.x + w / to.s - from.x - w / from.s) * k;
    const cy = from.y + h / from.s + (to.y + h / to.s - from.y - h / from.s) * k;
    const s = from.s + (to.s - from.s) * k;
    view.cam = {s, x: cx - w / s, y: cy - h / s};
  }
  /** Where the top panel and the controls cover the picture (a KO tag is kept clear of them). */
  function safeArea() {
    const top = $("top").hidden ? 0 : $("top").getBoundingClientRect().bottom;
    const controls = $("controls").hidden ? 0 : innerHeight - $("controls").getBoundingClientRect().top;
    return {top: Math.max(0, top || 0), bottom: Math.max(0, controls || 0)};
  }
  function draw(now) {
    renderer.paint(ctx, {T: view.T, time: now, cam: view.cam, width: innerWidth, height: innerHeight, theme: view.theme,
                         clean: view.clean, safe: view.safe || (view.safe = safeArea()), dpr: window.devicePixelRatio || 1});
  }

  // ---- the look: sky or station --------------------------------------------------------------------------------
  const THEME_KEY = "kb-replay-theme";
  function storedTheme() { try { return localStorage.getItem(THEME_KEY); } catch (_) { return null; } }
  function setTheme(name, keep = false) {
    view.theme = Render.THEMES[name] ? name : "sky";
    document.body.classList.toggle("theme-station", view.theme === "station");
    const other = view.theme === "sky" ? Render.THEMES.station : Render.THEMES.sky;
    $("theme").textContent = other.icon;
    $("theme").title = `画风：${Render.THEMES[view.theme].label}（点一下换成${other.label}）`;
    if (keep) { try { localStorage.setItem(THEME_KEY, view.theme); } catch (_) { /* this page only */ } }
    dirty = true;
  }
  setTheme(Render.themeFrom(location.search, storedTheme()));
  $("theme").onclick = () => setTheme(view.theme === "sky" ? "station" : "sky", true);

  // ---- panels (redrawn when the turn or the falls change) -----------------------------------------------------
  function panels(force = false) {
    const t = Scene.turnAt(R, view.T), falls = R.falls.filter(f => f.tick <= view.T).length;
    const charging = R.frames[t].players.some(p => p && (p.skill || p.pause));
    if (!force && t === view.turn && falls === view.falls && !(charging && view.playing)) return;
    view.turn = t; view.falls = falls;
    const frame = R.frames[t];
    $("turn").textContent = frame.turn;
    $("turn-of").textContent = !watching ? `共 ${R.frames.length - 1} 回合`
      : watching.ended ? (watching.error ? `对局出错（${watching.error}）` : "已结束 · 正在保存回放…")
      : Live.decided(R.frames[R.frames.length - 1], R.header.max_turns) ? "已结束 · 正在保存回放…"
      : `实时 · 已到第 ${R.frames.length - 1} 回合`;
    const standing = Scene.standing(R, view.T), inNow = standing.filter(row => row.out === null).length;
    $("alive").textContent = `${inNow} / ${R.n}`;
    $("marks").innerHTML = R.seats.map(seat => `<span class="mark${standing.find(r => r.seat === seat.i).out === null ? "" : " out"}" style="color:${seat.color}" title="${esc(seat.name)}"></span>`).join("");
    const arena = frame.arena || {};
    $("edge").textContent = `${Board.fmt(2 * (arena.half ?? R.H0))}`;
    const next = arena.next;
    $("edge-next").textContent = !next ? "没有已宣布的缩圈"
      : frame.turn >= next.turn ? `正在缩到 ${Board.fmt(2 * next.half)}` : `第 ${next.turn} 回合起缩到 ${Board.fmt(2 * next.half)}`;
    $("edge-next").classList.toggle("warn", Boolean(next));
    $("scrub").value = t;
    $("meta").textContent = `种子 ${R.header.seed ?? "?"} · 规则 ${R.header.rules_version ?? "?"}`;
    Board.panel($("board"), R, view.T);
    $("feed-list").innerHTML = Board.feed(R, view.T, 14);
    const winner = !view.clean && standing.find(row => row.final && row.place === 1);
    $("banner").hidden = !winner;
    if (winner) {
      const seat = R.seats[winner.seat];
      $("banner").innerHTML = `<span class="crown">♛</span>${Board.portrait(seat, "")}<strong style="--seat:${seat.color}">${esc(seat.name)}</strong>` +
        `<span>获胜 · ${winner.kills} 击杀 · ${Board.fmt(winner.score)} 分</span>`;
    }
  }

  // ---- controls -----------------------------------------------------------------------------------------------
  /** Jumps to the end of turn t (its frame). */
  function go(t) {
    view.T = Math.max(0, Math.min(R.frames.length - 1, t)) * R.D;
    panels(true);
    dirty = true;
    if (view.follow) view.cam = followCam();          // a jump re-frames at once; playback eases
  }
  function setPlaying(on) {
    view.playing = on && view.T < stopAt();
    view.last = performance.now();
    $("play").textContent = view.playing ? "❚❚" : "▶";
    dirty = true;
  }
  const turnNow = () => Scene.turnAt(R, view.T);
  $("first").onclick = () => go(0);
  $("last").onclick = () => { setPlaying(false); go(R.frames.length - 1); view.T = R.tail; if (view.follow) view.cam = followCam(); };
  // a step goes to the frame before or after the moment shown (from the middle of a turn: its start or its end)
  $("prev").onclick = () => { setPlaying(false); go(turnNow() - 1); };
  $("next").onclick = () => { setPlaying(false); go(view.T < turnNow() * R.D - 1e-6 ? turnNow() : turnNow() + 1); };
  $("play").onclick = () => { if (view.T >= stopAt()) { view.until = null; if (view.T >= R.tail) go(0); } setPlaying(!view.playing); };
  $("speed").onchange = event => { view.speed = +event.target.value; };
  $("scrub").oninput = event => { setPlaying(false); go(+event.target.value); };
  $("fit").onclick = () => fitCamera();
  document.addEventListener("keydown", event => {
    if (!R || event.target.tagName === "SELECT" || event.target.tagName === "INPUT" && event.target.type !== "range") return;
    if (event.key === " ") { event.preventDefault(); $("play").click(); }
    if (event.key === "ArrowLeft") { event.preventDefault(); $("prev").click(); }
    if (event.key === "ArrowRight") { event.preventDefault(); $("next").click(); }
  });
  // camera: drag to pan, wheel to zoom about the pointer, double click to fit
  let drag = null;
  canvas.addEventListener("pointerdown", event => {
    drag = {x: event.clientX, y: event.clientY, cam: {...view.cam}, moved: false};
    canvas.setPointerCapture(event.pointerId); canvas.classList.add("dragging");
  });
  canvas.addEventListener("pointermove", event => {
    if (!drag) return;
    if (Math.abs(event.clientX - drag.x) + Math.abs(event.clientY - drag.y) > 3) view.follow = false;
    if (view.follow) return;
    view.cam.x = drag.cam.x - (event.clientX - drag.x) / view.cam.s;
    view.cam.y = drag.cam.y - (event.clientY - drag.y) / view.cam.s;
    dirty = true;
  });
  canvas.addEventListener("pointerup", () => { drag = null; canvas.classList.remove("dragging"); });
  canvas.addEventListener("wheel", event => {
    event.preventDefault();
    view.follow = false;
    const factor = Math.exp(-event.deltaY * 0.0015), s = view.cam.s;
    const next = Math.max(view.fit * 0.6, Math.min(view.fit * 6, s * factor));
    const wx = view.cam.x + event.clientX / s, wy = view.cam.y + event.clientY / s;
    view.cam = {s: next, x: wx - event.clientX / next, y: wy - event.clientY / next};
    dirty = true;
  }, {passive: false});
  canvas.addEventListener("dblclick", () => fitCamera());
  let viewport = [innerWidth, innerHeight];
  window.addEventListener("resize", () => {            // keep the same spot in the middle and the same zoom
    resize();
    if (!R) return;
    if (view.follow) { viewport = [innerWidth, innerHeight]; return fitCamera(); }
    const {s} = view.cam, zoom = s / view.fit;
    const wx = view.cam.x + viewport[0] / 2 / s, wy = view.cam.y + viewport[1] / 2 / s;
    viewport = [innerWidth, innerHeight];
    fitCamera();
    const next = view.fit * zoom;
    view.cam = {s: next, x: wx - innerWidth / 2 / next, y: wy - innerHeight / 2 / next};
  });

  function loop(now) {
    if (R) {
      if (view.playing) {
        const dt = Math.min(250, now - view.last);           // a hidden tab does not jump ahead
        const before = view.T;
        view.T = Math.min(stopAt(), view.T + dt / 1000 * R.rate * view.speed);
        if (sfx && !asleep && !document.hidden) sfx.span(R, before, view.T);   // the ticks just played on screen
        if (view.T >= stopAt()) setPlaying(false);
        panels();
      }
      view.last = now;
      ease();
      // always repaint (the danger ring pulses and figures breathe), unless the embedding page keeps this one asleep
      if (!asleep) draw(now);
      dirty = false;
    }
    requestAnimationFrame(loop);
  }

  async function open(replay, source, players = null) {
    const next = Scene.build(replay, Art, (new URLSearchParams(location.search).get("fam") || "").split(","));
    next.source = source;
    for (const seat of next.seats) seat.match = seat.name;   // the name in the match (#names= by it)
    Board.applyProfiles(next, players);
    R = next;
    renderer = Render.create({R, Scene, Art, sprites});
    preloadFigures();                                         // drawn as they come
    $("picker").hidden = true;
    for (const id of ["top", "side", "feed", "controls"]) $(id).hidden = false;
    $("scrub").max = R.frames.length - 1;
    names();
    resize();
    applyHash();
    // for checks from outside (screenshots of a page in the background, where animation frames do not run)
    window.KbReplay = {R, view, go, setPlaying, sfx, ready: false, paint: () => draw(performance.now()),
                       seek: T => { view.T = Math.max(0, Math.min(R.tail, T)); if (view.follow) view.cam = followCam();
                                    panels(true); draw(performance.now()); }};
    return next;
  }

  function names() {
    labelSeats();
    document.title = `擂台回放 · ${R.seats.map(seat => seat.name).join(" / ")}`;
  }
  /** #names=: each seat's name as the video calls it (see the top), else the name the replay or the console gave it
      (seat.given). Two seats under one label (a program against its copy) are numbered. */
  function labelSeats() {
    const map = view.names || {}, used = new Map();
    for (const seat of R.seats) {
      if (seat.name !== seat.video) seat.given = seat.name;   // a name from the replay or the console, not ours
      const base = seat.match ?? seat.given, model = seat.profile && seat.profile.model;
      const copy = /^(.+)-(\d+)$/.exec(base);
      const label = model && typeof map[model] === "string" ? map[model]
        : typeof map[base] === "string" ? map[base]
        : copy && typeof map[copy[1]] === "string" ? `${map[copy[1]]} ${copy[2]}` : null;
      const n = label === null ? 0 : (used.get(label) || 0) + 1;
      if (label !== null) used.set(label, n);
      seat.video = label === null ? null : n > 1 ? `${label} ${n}` : label;
      seat.name = seat.video ?? seat.given;
    }
  }

  function applyHash() {
    const hash = new URLSearchParams(location.hash.slice(1));
    view.clean = hash.get("ui") === "0";
    document.body.classList.toggle("clean", view.clean);
    document.body.classList.toggle("no-tags", hash.get("tags") === "0");
    try { view.names = hash.has("names") ? JSON.parse(hash.get("names")) : null; } catch (_) { view.names = null; }
    names();
    view.safe = null;                                       // the panels on top may have come or gone
    const until = Number.parseInt(hash.get("until"), 10);
    view.until = Number.isFinite(until) ? Math.max(0, until) * R.D : null;
    viewport = [innerWidth, innerHeight];
    fitCamera();
    if (hash.has("speed")) { view.speed = +hash.get("speed"); $("speed").value = hash.get("speed"); }
    if (hash.has("z") || hash.has("c")) {
      const s = view.fit * (+hash.get("z") || 1);
      const [cx, cy] = (hash.get("c") || "0,0").split(",").map(Number);
      view.cam = {s, x: cx - innerWidth / 2 / s, y: cy - innerHeight / 2 / s};
      view.follow = false;
    }
    go(hash.has("t") ? Number.parseInt(hash.get("t"), 10) || 0 : 0);
    // a replay opened plainly plays from the start; a fixed picture (#t=) waits unless #play=1
    if (hash.get("play") === "1" || !hash.has("t") && hash.get("play") !== "0") setPlaying(true);
  }
  window.addEventListener("hashchange", () => {
    if (!R) return;
    applyHash();
    if (R.ready) announceReady(R);                         // the new picture is there, figures and all
  });

  resize();
  requestAnimationFrame(loop);
  start();
})();
</script>
</body>
</html>
